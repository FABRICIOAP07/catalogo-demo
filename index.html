<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollería El Sabor - Carta</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #fff8e7;
        margin: 0;
        padding: 16px;
    }
    h1 {
        color:#b22222;
        text-align: center;
    }
    .subtitulo {
        text-align: center;
        color: #0e0d0db0;
        font-size: 20px;
        font-family: Arial, sans-serif;
  

    }
    .producto {
        background-color: white;
        border-radius: 12px;
        padding: 16px;
        margin: 12px auto;
        max-width: 400px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .producto h2 {
        margin: 0 0 8px 0;
        font-size: 20px; /* Esto es para el titulo de arriba */
    }
    .precio {
        color: #b22222;
        font-weight: bold;
        font-size: 18px; /* Esto es para el precio */
    }
    .producto img {
        width: 100%;
        height: 200px;
        object-fit: cover;/*ajusta la imagen al tamaño del contenedor */
        border-radius: 8px;
    }
    .boton {
        display: block;
        background-color: #25d366;
        color: white;
        text-align: center;
        text-decoration: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        margin-top: 12px;
    }
    
  </style>
</head>
<body>
  <h1>Pollería El Sabor</h1>
  <p class="subtitulo"><strong>Haz tu pedido por WhatsApp</strong></p>
  <div id="catalogo"></div>

<script>
  const numero = "51999999999"; // Reemplaza con tu número de WhatsApp

  const productos = [
    { nombre: "1/8 de pollo con papas", descripcion: "Incluye ensalada y cremas.", precio: 18, imagen: "polloalabrasa.webp" },
    { nombre: "1/4 de pollo con papas", descripcion: "Incluye ensalada y cremas.", precio: 32, imagen: "polloalabrasa.webp" },
    { nombre: "1 pollo con papas", descripcion: "Incluye ensalada y cremas.", precio: 60, imagen: "polloalabrasa.webp" },
    { nombre: "Helado de vainilla", descripcion: "Incluye topping de chocolate.", precio: 10, imagen: "vainillahelado.jpg"}
  ];

  const contenedor = document.getElementById("catalogo");

  productos.forEach(function (p) {
    const mensaje = "Hola, quiero pedir " + p.nombre;
    const link = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);

    contenedor.innerHTML += `
      <div class="producto">
        <img src="${p.imagen}" alt="${p.nombre}">
        <h2>${p.nombre}</h2>
        <p>${p.descripcion}</p>
        <p class="precio">S/ ${p.precio.toFixed(2)}</p>
        <a class="boton" href="${link}" target="_blank">Pedir por WhatsApp</a>
      </div>
    `;
  });
</script>
</body>
</html>
